<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📘 Math Question Builder</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/style.css" />

    <!-- KaTeX Styles -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
    ></script>

    <!-- SortableJS for Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  </head>

  <body class="bg-gray-100 text-gray-800 font-sans transition-all dark:bg-slate-900 dark:text-slate-200">
    <main
      id="app"
      class="container mx-auto mt-10 p-6 bg-white rounded-lg shadow-md dark:bg-slate-800"
    >
      <!-- Header -->
      <header class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-3xl font-bold text-blue-700 dark:text-blue-400">
            📖 Math Question Builder
          </h1>
          <p class="text-gray-500 mt-1 dark:text-gray-300">
            Easily create, save, and export math questions.
          </p>
        </div>

        <!-- Theme Toggle -->
        <button
          id="theme-toggle-icon"
          class="text-2xl p-2 rounded-full transition-all hover:scale-110 dark:text-yellow-300 text-blue-600"
          aria-label="Toggle Theme"
        >
          🌙
        </button>
      </header>

      <!-- Status Message -->
      <div id="status-message" class="hidden mt-4 p-2 rounded text-center"></div>

      <!-- Document Metadata -->
      <section class="mt-6 space-y-4">
        <div>
          <label for="doc-title" class="font-semibold">📌 Document Title:</label>
          <input
            type="text"
            id="doc-title"
            class="w-full mt-1 p-2 border rounded dark:bg-slate-700"
            placeholder="Enter title..."
          />
        </div>
        <div>
          <label for="doc-author" class="font-semibold">👤 Author:</label>
          <input
            type="text"
            id="doc-author"
            class="w-full mt-1 p-2 border rounded dark:bg-slate-700"
            placeholder="Enter author name..."
          />
        </div>
        <div>
          <label for="doc-date" class="font-semibold">📅 Date:</label>
          <input
            type="date"
            id="doc-date"
            class="w-full mt-1 p-2 border rounded dark:bg-slate-700"
          />
        </div>
      </section>

      <!-- Question Container -->
      <section id="question-container" class="mt-6 space-y-4"></section>

      <!-- Question Actions -->
      <div class="flex justify-between mt-6 gap-4">
        <button
          id="add-question"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        >
          ➕ Add Question
        </button>
        <button
          id="undo-action"
          class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
        >
          🔄 Undo Last Action
        </button>
      </div>

      <!-- Sticky Export Bar -->
      <section class="export-buttons grid grid-cols-2 gap-4 mt-6 sticky bottom-0 py-4 bg-gray-100 dark:bg-slate-800 z-50 border-t dark:border-slate-700">
        <button id="save-progress" class="bg-green-600 text-white py-2 px-4 rounded hover:bg-green-700">💾 Save Progress</button>
        <button id="export-json" class="bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700">📁 Export JSON</button>
        <button id="export-latex" class="bg-yellow-600 text-white py-2 px-4 rounded hover:bg-yellow-700">📜 Export LaTeX</button>
        <button id="export-pdf" class="bg-gray-700 text-white py-2 px-4 rounded hover:bg-gray-800">📄 Export PDF</button>
        <button id="reset-page" class="bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 col-span-2">
          🔄 Reset
        </button>
      </section>

      <!-- Help Footer -->
      <footer class="text-center mt-6">
        <a
          href="help.html"
          class="text-blue-500 underline hover:text-blue-700 dark:text-blue-300 dark:hover:text-blue-500"
        >
          📖 Need Help?
        </a>
      </footer>
    </main>

    <!-- App Entry -->
    <script type="module" src="/src/index.jsx"></script>

    <!-- Theme Toggle Script -->
    <script>
      const themeToggleBtn = document.getElementById("theme-toggle-icon");
      const htmlEl = document.documentElement;

      const applyTheme = (isDark) => {
        htmlEl.classList.toggle("dark", isDark);
        localStorage.setItem("theme", isDark ? "dark" : "light");
        themeToggleBtn.textContent = isDark ? "🌞" : "🌙";
      };

      applyTheme(localStorage.getItem("theme") === "dark");

      themeToggleBtn.addEventListener("click", () => {
        const isDark = !htmlEl.classList.contains("dark");
        applyTheme(isDark);
      });
    </script>
  </body>
</html>
